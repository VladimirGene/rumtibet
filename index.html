<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
		<script type="module" src="/src/main.js"></script>
		<title>Rumtibet</title>
	</head>
	<body>
		<header class="header">
			<div class="container">
				<div class="header__inner">
					<div class="header__logo">
						<a href="#"
							><img
								src="./src/images/logotype.svg"
								alt="Логотип сайта Rumtibet"
						/></a>
					</div>
					<nav class="header__nav">
						<ul class="header__list">
							<li class="header__item">
								<a class="header__link" href="#">Главная</a>
							</li>
							<li class="header__item">
								<a class="header__link" href="#">Про гида</a>
							</li>
							<li class="header__item">
								<a class="header__link" href="#">Программа тура</a>
							</li>
							<li class="header__item">
								<a class="header__link" href="#">Стоимость</a>
							</li>
							<li class="header__item">
								<a class="header__link" href="#">Блог</a>
							</li>
							<li class="header__item">
								<a class="header__link" href="#">Контакты</a>
							</li>
						</ul>
						<ul class="header__list-mobile js-header__list-mobile">
							<li class="header__item-mobile">
								<a class="header__link-mobile js-header__link-mobile" href="#"
									>Про гида</a
								>
							</li>
							<li class="header__item-mobile">
								<a class="header__link-mobile js-header__link-mobile" href="#"
									>Программа тура</a
								>
							</li>
							<li class="header__item-mobile">
								<a class="header__link-mobile js-header__link-mobile" href="#"
									>Стоимость</a
								>
							</li>
							<li class="header__item-mobile">
								<a class="header__link-mobile js-header__link-mobile" href="#"
									>Блог</a
								>
							</li>
							<li class="header__item-mobile">
								<a class="header__link-mobile js-header__link-mobile" href="#"
									>Контакты</a
								>
							</li>
						</ul>
					</nav>
					<button class="header__btn btn" href="#">Консультация</button>
					<button class="header__burger js-burger">
						<span class="header__burger-line"></span>
					</button>
				</div>
			</div>
		</header>
		<main class="main">
			<section class="hero">
				<div class="container hero__container">
					<div class="hero__inner">
						<h1 class="hero__headline">
							Насладись прогулкой в горах<br />
							с командой единомышленников
						</h1>
						<form class="hero__search search-form" action="#">
							<div class="search-form__field">
								<div class="search-form__control">
									<select
										class="search-form__select"
										id="location"
										name="location"
									>
										<option value="" disabled selected>Локация для тура</option>
										<option value="lhasa">Лхаса</option>
										<option value="shigatse">Шигадзе</option>
										<option value="ngari">Нгари</option>
									</select>
								</div>
								<span class="search-form__hint">выберите из списка</span>
							</div>
							<div class="search-form__field">
								<div class="search-form__control">
									<input
										class="search-form__input"
										type="date"
										id="date"
										name="date"
									/>
								</div>
								<span class="search-form__hint">Укажите диапазон</span>
							</div>
							<div class="search-form__field">
								<div class="search-form__control">
									<select
										class="search-form__select"
										id="participants"
										name="participants"
									>
										<option value="" disabled selected>Участники</option>
										<option value="2">4</option>
										<option value="4">6</option>
										<option value="6">8</option>
									</select>
								</div>
								<span class="search-form__hint">минимум 4 человека</span>
							</div>
							<button class="search-form__btn btn">Найти программу</button>
						</form>
						<button class="search-form__btn-mobile btn">Найти программу</button>
					</div>
				</div>
			</section>
		</main>
	</body>
</html>
